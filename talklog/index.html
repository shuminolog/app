<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="description" content="推しとのミーグリ・イベントでの会話をチャット画面風に再現・記録できます。">
  <link rel="canonical" href="https://shuminolog.github.io/app/talklog/">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="shuminolog">
  <meta property="og:title" content="talklog">
  <meta property="og:description" content="推しとのミーグリ・イベントでの会話をチャット画面風に再現・記録できます。">
  <meta property="og:url" content="https://shuminolog.github.io/app/talklog/">
  <meta property="og:image" content="https://shuminolog.github.io/app/talklog/icon.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="talklog">
  <meta name="twitter:description" content="推しとのミーグリ・イベントでの会話をチャット画面風に再現・記録できます。">
  <meta name="twitter:image" content="https://shuminolog.github.io/app/talklog/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html-to-image のCDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <!-- Cropper.js のCSS・JS CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K77LZSXZDR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-K77LZSXZDR');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="./icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --bubble-bg: #ffffff;
      --topic-bg: #e2e8f0;
      --text-main: #333333;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      -webkit-touch-callout: default;
      -webkit-user-select: none;
      user-select: none;
      min-height: 100dvh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .app-bg {
      background-color: var(--bg-color);
    }

    .topic-bubble {
      background-color: var(--topic-bg);
      color: #475569;
      border-radius: 9999px;
      overflow: hidden;
      background-clip: padding-box;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .chat-bubble-text {
      line-height: 1.5;
      word-break: break-word;
      text-align: left;
      white-space: pre-wrap;
    }

    .chat-bubble-fix {
      border-radius: 1rem;
      overflow: hidden;
      background-clip: padding-box;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .dragging {
      opacity: 0.4;
      background: #e2e8f0 !important;
    }
    .drag-over {
      border-top: 2px dashed #6366f1 !important;
    }

    /* サンプルに合わせたmodal-overlayの定義 */
    .modal-overlay {
      position: fixed;
      top: calc(0px - env(safe-area-inset-top, 0px));
      right: 0;
      bottom: 0;
      left: 0;
      padding-top: env(safe-area-inset-top, 0px);
    }
  </style>
</head>
<body class="app-bg font-sans antialiased text-slate-800 flex items-center justify-center p-0 sm:p-4">

  <!-- アプリメインコンテナ -->
  <div id="mainAppContainer" class="app-bg w-full sm:max-w-md h-full sm:h-[844px] sm:rounded-[40px] sm:shadow-2xl flex flex-col overflow-hidden relative">

    <!-- ==================== 画面1：メンバーリスト ==================== -->
    <div id="screen-members" class="screen active">
      <div class="p-4 bg-transparent flex items-center justify-between relative shrink-0 z-10">
        <div class="relative">
          <button onclick="toggleGlobalMenu(event)" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 hover:bg-white/70 hover:text-slate-700 transition" aria-label="メニュー">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div id="globalContextMenu" class="absolute left-0 mt-1 hidden bg-white rounded-xl shadow-xl py-1 z-50 text-xs w-52 overflow-hidden border border-slate-100 whitespace-nowrap">
            <button onclick="exportBackup(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-file-export text-slate-400 w-4"></i> バックアップを書き出す
            </button>
            <button onclick="document.getElementById('backupImportInput').click(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-file-import text-slate-400 w-4"></i> バックアップを読み込む
            </button>
            <button onclick="location.reload(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-rotate-right text-slate-400 w-4"></i> ページを再読み込み
            </button>
          </div>
          <input type="file" id="backupImportInput" accept="application/json,.json" class="hidden" onchange="importBackup(event)">
        </div>
        <h1 class="font-bold text-slate-800 absolute left-1/2 -translate-x-1/2"></h1>
        <button onclick="openMemberModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="メンバー追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="px-4 py-2 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-slate-400 text-xs"></i>
          <input type="text" id="searchMember" placeholder="メンバーを検索" class="w-full bg-white/80 text-xs pl-9 pr-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <!-- メンバー一覧 -->
      <div class="flex-1 overflow-y-auto px-2 divide-y divide-slate-200/40 pb-4" id="memberList" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <!-- ==================== 画面2：イベントトーク一覧 ==================== -->
    <div id="screen-events" class="screen">
      <div class="p-4 flex items-center justify-between relative shrink-0 z-10">
        <button onclick="switchScreen('screen-members')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="font-bold text-slate-800 absolute left-1/2 -translate-x-1/2" id="eventScreenTitle">トークルーム</h1>
        <button onclick="openEventModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="イベント追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="px-4 py-2 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-slate-400 text-xs"></i>
          <input type="text" id="searchEvent" placeholder="イベントを検索" class="w-full bg-white/80 text-xs pl-9 pr-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <!-- イベント一覧（カード形式に改善） -->
      <div class="flex-1 overflow-y-auto px-3 space-y-2.5 pb-4 pt-1" id="eventRoomList" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <!-- ==================== 画面3：トークルーム ==================== -->
    <div id="screen-chat" class="screen">
      <div class="p-4 flex items-center justify-between relative shrink-0 z-10">
        <button onclick="switchScreen('screen-events')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="font-bold text-slate-800 absolute left-1/2 -translate-x-1/2" id="chatScreenTitle">トークルーム</h1>
        <div class="flex items-center gap-1">
          <!-- アルバムボタン -->
          <button onclick="openAlbumModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="アルバムを見る">
            <i class="fa-solid fa-images"></i>
          </button>
          <button onclick="exportChatImage()" data-button-name="output_image" class="track-btn w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="トーク画像を保存">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>
      </div>

      <!-- チャット画面全体のラッパー -->
      <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <!-- キャプチャ対象エリア -->
        <div id="captureArea" class="flex-1 flex flex-col min-h-0 app-bg overflow-hidden">
          <div class="pt-3 pb-1 px-4 shrink-0 bg-transparent flex items-center justify-between">
            <div class="flex items-center min-w-0">
              <div class="min-w-0">
                <div class="text-sm font-bold text-slate-800 truncate mb-0.5" id="chatEventDate">2026-04-29</div>
                <div class="text-xs text-slate-500 truncate" id="chatEventPlace">幕張メッセ 第1部</div>
              </div>
            </div>
            <div id="chatEventCount" class="text-right text-xs shrink-0 leading-tight hidden"></div>
          </div>

          <!-- メッセージエリア -->
          <div class="flex-1 p-3 overflow-y-auto space-y-1.5 min-h-0 mx-1" id="chatMessages" style="-webkit-overflow-scrolling: touch;"></div>
        </div>
      </div>

      <div class="px-3 pt-2 pb-[calc(env(safe-area-inset-bottom,16px)+8px)] pl-4 pr-4 bg-transparent flex items-end gap-2 shrink-0 z-10">
        <button id="senderToggleBtn" onclick="toggleSenderMode(event)" class="w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-sm shrink-0 transition bg-white text-xs font-bold text-slate-700 mb-0.5">
          <span id="senderToggleLabel">メンバー</span>
        </button>
        <textarea id="messageInput" rows="1" placeholder="メッセージを入力..." class="flex-1 bg-slate-200/70 text-sm px-4 py-2.5 rounded-2xl focus:bg-white focus:outline-none transition resize-none max-h-32" style="line-height: 1.5;"></textarea>
        <button onclick="sendMessage()" class="text-slate-600 hover:text-slate-800 px-2 text-xl mb-1.5">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- ==================== モーダル各種（画面全体の最上位に配置） ==================== -->

  <!-- アルバムモーダル -->
  <div id="albumModal" class="fixed inset-0 bg-black/30 hidden flex-col items-center justify-center p-2 sm:p-4 z-[9999]" onclick="closeAlbumModal()">
    <div class="bg-white rounded-2xl w-full max-w-sm max-h-[90vh] p-4 flex flex-col shadow-2xl relative overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-3 shrink-0">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-images text-indigo-600"></i> アルバム
        </h3>
        <button onclick="closeAlbumModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 写真追加ボタン -->
      <div class="mb-3 shrink-0">
        <label class="w-full py-2.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl text-xs font-bold flex items-center justify-center gap-2 cursor-pointer transition">
          <i class="fa-solid fa-plus"></i> 写真を追加する
          <input type="file" id="albumPhotoInput" accept="image/*" multiple class="hidden" onchange="addPhotosToAlbum(event)">
        </label>
      </div>

      <!-- 写真一覧グリッド -->
      <div class="flex-1 bg-slate-50 rounded-xl p-2 overflow-y-auto grid grid-cols-2 gap-2.5 auto-rows-max min-h-[487.5px] max-h-[62vh]" id="albumPhotoGrid"></div>

      <button onclick="closeAlbumModal()" class="mt-3 shrink-0 w-full py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold">閉じる</button>

      <!-- 写真フルビューモーダル（アルバム用） -->
      <div id="photoFullModal" class="absolute inset-0 rounded-2xl bg-[rgb(0_0_0/0.3)] hidden flex-col items-center justify-center p-4 z-20" onclick="closePhotoFullModal()">

        <div class="relative max-w-full max-h-full flex flex-col items-center justify-center" onclick="event.stopPropagation()">
          <!-- 写真表示エリア -->
          <div class="relative flex items-center justify-center">
            <!-- 前へボタン -->
            <button onclick="navigatePhoto(-1)" class="absolute left-2 text-white text-lg w-8 h-8 flex items-center justify-center rounded-full bg-black/30 hover:bg-black/30 transition z-10 shadow-lg" aria-label="前の写真">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>

            <!-- 拡大画像 -->
            <img id="photoFullElement" src="" alt="拡大写真" class="max-w-full max-h-[75vh] rounded-xl object-contain shadow-2xl">

            <!-- 次へボタン -->
            <button onclick="navigatePhoto(1)" class="absolute right-2 text-white text-lg w-8 h-8 flex items-center justify-center rounded-full bg-black/30 hover:bg-black/30 transition z-10 shadow-lg" aria-label="次の写真">
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>

            <!-- 【中央最下部】×ボタン -->
            <button onclick="closePhotoFullModal()" class="absolute bottom-3 left-1/2 -translate-x-1/2 text-white w-8 h-8 flex items-center justify-center rounded-full bg-black/30 hover:bg-black/30 transition z-20 shadow-md" aria-label="閉じる">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- 【右上】三点マークボタン -->
            <button onclick="event.stopPropagation(); togglePhotoMenu(event);" class="absolute top-2 right-2 text-white w-8 h-8 flex items-center justify-center rounded-full bg-black/30 hover:bg-black/30 transition z-20 shadow-md" aria-label="メニュー">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>

            <!-- 三点マークの削除メニュー -->
            <div id="photoActionMenu" class="absolute top-11 right-2 hidden bg-white rounded-xl shadow-xl py-1 z-30 text-xs w-32 overflow-hidden border border-slate-100">
              <button onclick="event.stopPropagation(); deleteCurrentPhoto(); closePhotoMenu();" class="w-full text-left px-3 py-2.5 hover:bg-red-50 flex items-center gap-2 text-red-600">
                <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除する
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
   <div id="imagePreviewModal" class="fixed inset-0 bg-black/30 hidden flex-col items-center justify-center p-2 sm:p-4 z-[9999]" onclick="closeImagePreviewModal()">
    <div class="bg-white rounded-2xl w-full max-w-sm max-h-[90vh] p-4 flex flex-col shadow-2xl relative" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-2 shrink-0">
        <h3 class="text-sm font-bold text-slate-800">トーク画像（長押しで保存）</h3>
        <button onclick="closeImagePreviewModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="flex-1 bg-slate-100 rounded-xl p-2 flex items-center justify-center min-h-0 overflow-hidden">
        <img id="previewImageElement" src="" alt="Generated Chat Image" class="max-w-full max-h-full rounded shadow object-contain" style="-webkit-touch-callout: default !important; -webkit-user-select: auto !important; user-select: auto !important; touch-action: auto !important; pointer-events: auto !important;">
      </div>
      <button onclick="closeImagePreviewModal()" class="mt-3 shrink-0 w-full py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold">閉じる</button>
    </div>
  </div>

  <!-- メンバーモーダル -->
  <div id="memberModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[9999]" onclick="closeMemberModal()">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="memberModalTitle">メンバー追加</h3>
      <input type="hidden" id="editMemberId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">名前</label>
          <input type="text" id="inputMemberName" placeholder="例: 矢吹奈子" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">グループ名</label>
          <input type="text" id="inputMemberRole" placeholder="例: HKT48" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">アイコン画像</label>
          <input type="file" id="inputMemberFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <input type="text" id="inputMemberAvatarUrl" placeholder="または画像URLを入力" class="w-full bg-slate-50 rounded-lg p-2 mt-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          
          <div id="cropperContainer" class="hidden mt-3">
            <div class="max-h-48 overflow-hidden bg-slate-100 rounded-lg">
              <img id="cropperImage" class="max-w-full">
            </div>
            <button type="button" onclick="executeCrop()" class="mt-2 w-full py-1.5 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-lg hover:bg-indigo-100">確定</button>
          </div>

          <div id="cropPreviewWrapper" class="mt-2 hidden items-center gap-2">
            <span class="text-xs text-slate-500">プレビュー:</span>
            <img id="cropResultPreview" class="w-10 h-10 rounded-full object-cover border">
          </div>
        </div>
      </div>
      <div class="flex items-center justify-between mt-5">
        <button type="button" id="deleteMemberBtnInModal" onclick="deleteMemberFromModal()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg hidden">削除</button>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="closeMemberModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveMember()" data-button-name="add_member" class="track-btn px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- イベントモーダル -->
  <div id="eventModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[9999]" onclick="closeEventModal()">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl" onclick="event.stopPropagation()">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="eventModalTitle">イベント追加</h3>
      <input type="hidden" id="editEventId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">日付</label>
          <div onclick="openCustomCalendar()" id="inputEventDateDisplay" class="w-full bg-slate-50 rounded-lg p-2 text-slate-800 cursor-pointer flex items-center justify-between border border-transparent hover:border-indigo-300 transition">
            <span id="dateDisplayText">2026-04-29</span>
            <i class="fa-solid fa-calendar-days text-slate-400 text-xs"></i>
          </div>
          <input type="hidden" id="inputEventDate">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">場所</label>
          <input type="text" id="inputEventPlace" placeholder="例: 幕張メッセ" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">部</label>
          <input type="text" id="inputEventSection" placeholder="例: 第1部" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">枚数</label>
          <input type="number" id="inputEventCount" min="1" step="1" placeholder="例: 3" class="w-full bg-slate-50 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex items-center justify-between mt-5">

  <script>
    let db = null;
    let membersData = [];
    let currentMemberId = null;
    let currentEventId = null;
    let senderMode = 'them';
    let selectedMemberIdForContext = null;
    let selectedEventIdForContext = null;
    let selectedMsgIdForContext = null;
    let currentPhotoIndex = null;
    
    let cropper = null;
    let croppedAvatarBase64 = null;

    let calYear = 2026;
    let calMonth = 3;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('IdolTalkDB', 2);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('appData')) {
            database.createObjectStore('appData');
          }
        };
      });
    }

    function loadDataFromDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['appData'], 'readonly');
        const store = transaction.objectStore('appData');
        const request = store.get('members');
        request.onsuccess = () => {
          membersData = request.result || [];
          membersData.forEach(m => {
            if (m.events) {
              m.events.forEach(ev => {
                if (!ev.photos) ev.photos = [];
              });
            }
          });
          resolve(membersData);
        };
        request.onerror = () => reject(request.error);
      });
    }

    function saveDataToDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['appData'], 'readwrite');
        const store = transaction.objectStore('appData');
        const request = store.put(membersData, 'members');
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function migrateLocalStorageIfNeeded() {
      const local = localStorage.getItem('idol_talk_members');
      if (local) {
        try {
          const parsed = JSON.parse(local);
          if (Array.isArray(parsed) && parsed.length > 0) {
            membersData = parsed;
            membersData.forEach(m => {
              if (m.events) {
                m.events.forEach(ev => {
                  if (!ev.photos) ev.photos = [];
                });
              }
            });
            await saveDataToDB();
            localStorage.removeItem('idol_talk_members');
          }
        } catch (e) {
          console.error('Migration failed', e);
        }
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-members') renderMemberList();
      if (screenId === 'screen-events') renderEventList();
      if (screenId === 'screen-chat') renderChatMessages();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const edgeThreshold = 50;
      const swipeThreshold = 50;
      let touchStartX = 0;
      let touchStartY = 0;
      let isEdgeTouch = false;

      document.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        
        const windowWidth = window.innerWidth;
        if (touchStartX <= edgeThreshold || touchStartX >= windowWidth - edgeThreshold) {
          isEdgeTouch = true;
        } else {
          isEdgeTouch = false;
        }
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (!isEdgeTouch) return;
        if (e.changedTouches.length !== 1) return;

        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
          const activeScreen = document.querySelector('.screen.active');
          if (!activeScreen) return;

          if (activeScreen.id === 'screen-events') {
            if (diffX > 0) switchScreen('screen-members');
          } else if (activeScreen.id === 'screen-chat') {
            if (diffX > 0) switchScreen('screen-events');
          } else if (activeScreen.id === 'screen-members') {
            if (diffX < 0 && currentMemberId) switchScreen('screen-events');
          }
        }
        isEdgeTouch = false;
      }, { passive: true });
    });

    function toggleGlobalMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('globalContextMenu');
      closeAllContextMenus();
      menu.classList.toggle('hidden');
    }

    function closeAllContextMenus() {
      const menu = document.getElementById('globalContextMenu');
      if (menu) menu.classList.add('hidden');
      const mMenu = document.getElementById('memberContextMenu');
      if (mMenu) mMenu.classList.add('hidden');
      const eMenu = document.getElementById('eventContextMenu');
      if (eMenu) eMenu.classList.add('hidden');
      const msgMenu = document.getElementById('msgActionMenu');
      if (msgMenu) msgMenu.classList.add('hidden');
      closePhotoMenu();
    }
    document.addEventListener('click', () => closeAllContextMenus());

    let draggedId = null;

    function setupDragAndDrop(element, handleElement, id, listType) {
      handleElement.setAttribute('draggable', 'true');
      handleElement.classList.add('drag-handle');

      handleElement.addEventListener('dragstart', (e) => {
        draggedId = id;
        e.dataTransfer.setData('text/plain', id);
        setTimeout(() => element.classList.add('dragging'), 0);
      });

      handleElement.addEventListener('dragend', () => {
        element.classList.remove('dragging');
        draggedId = null;
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      element.addEventListener('dragover', (e) => {
        e.preventDefault();
        element.classList.add('drag-over');
      });

      element.addEventListener('dragleave', () => {
        element.classList.remove('drag-over');
      });

      element.addEventListener('drop', async (e) => {
        e.preventDefault();
        element.classList.remove('drag-over');
        if (!draggedId || draggedId === id) return;

        if (listType === 'member') {
          const fromIdx = membersData.findIndex(m => m.id === draggedId);
          const toIdx = membersData.findIndex(m => m.id === id);
          if (fromIdx !== -1 && toIdx !== -1) {
            const [moved] = membersData.splice(fromIdx, 1);
            membersData.splice(toIdx, 0, moved);
            await saveDataToDB();
            renderMemberList(document.getElementById('searchMember').value.trim());
          }
        }
      });
    }

    function renderMemberList(filter = '') {
      const listEl = document.getElementById('memberList');
      listEl.innerHTML = '';
      const filtered = membersData.filter(m => m.name.includes(filter) || m.role.includes(filter));

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">メンバーがいません</div>`;
        return;
      }

      filtered.forEach((member) => {
        const item = document.createElement('div');
        item.className = 'py-3 px-3 flex items-center justify-between hover:bg-white/40 rounded-xl transition group';

        item.innerHTML = `
          <div class="flex items-center gap-3.5 flex-1 min-w-0">
            <div class="drag-handle text-slate-300 group-hover:text-slate-400 px-1 py-2"><i class="fa-solid fa-grip-vertical text-xs"></i></div>
            <div class="flex items-center gap-3.5 flex-1 min-w-0 cursor-pointer" onclick="selectMember('${member.id}')">
              <img src="${escapeHtml(member.avatar)}" crossorigin="anonymous" class="w-12 h-12 rounded-full object-cover shrink-0" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80';">
              <div class="truncate">
                <h3 class="text-sm font-bold text-slate-800 truncate">${escapeHtml(member.name)}</h3>
                <p class="text-xs text-slate-500 truncate">${escapeHtml(member.role)}</p>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 ml-2 shrink-0">
            <button onclick="openMemberContextMenu(event, '${member.id}'); event.stopPropagation();" class="w-8 h-8 rounded-none bg-transparent text-slate-500 hover:text-slate-700 transition flex items-center justify-center">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>
          </div>
        `;
        const handleEl = item.querySelector('.drag-handle');
        setupDragAndDrop(item, handleEl, member.id, 'member');
        listEl.appendChild(item);
      });
    }

    function selectMember(memberId) {
      currentMemberId = memberId;
      const member = membersData.find(m => m.id === memberId);
      document.getElementById('eventScreenTitle').textContent = `${member.name}`;
      switchScreen('screen-events');
    }

    function renderEventList(filter = '') {
      const listEl = document.getElementById('eventRoomList');
      listEl.innerHTML = '';
      const member = membersData.find(m => m.id === currentMemberId);
      if (!member) return;

      const filtered = member.events.filter(e => (e.date || '').includes(filter) || (e.place || '').includes(filter) || (e.section || '').includes(filter));

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm bg-white/50 rounded-2xl border border-slate-100">イベントがありません</div>`;
        return;
      }

      filtered.forEach((event) => {
        const placeAndSection = [event.place, event.section].filter(Boolean).join(' ') || '場所未設定';
        const photoCount = event.photos ? event.photos.length : 0;
        const item = document.createElement('div');
        
        item.className = 'bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex items-center justify-between hover:border-indigo-200 transition group cursor-pointer';
        item.onclick = () => selectEvent(event.id);

        item.innerHTML = `
          <div class="flex-1 min-w-0 pr-2">
            <div class="flex items-center justify-between mb-1.5">
              <div class="text-sm font-bold text-slate-800 leading-none">
                <span>${escapeHtml(event.date || '日付未設定')}</span>
              </div>
              <div class="flex items-center gap-1.5 text-xs shrink-0">
                ${photoCount > 0 ? `<span class="bg-slate-100 text-slate-700 font-semibold h-[26px] px-2 rounded-md inline-flex items-center justify-center"><i class="fa-solid fa-image text-[11px]"></i></span>` : ''}
                ${event.count ? `<span class="bg-indigo-50 text-indigo-700 font-semibold h-[26px] px-2 rounded-md inline-flex items-center justify-center gap-1"><svg class="w-3 h-3 fill-current inline-block align-middle shrink-0" viewBox="0 0 576 512"><path d="M0 128C0 92.7 28.7 64 64 64H512c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128zm128 64V320c0 8.8 7.2 16 16 16H432c8.8 0 16-7.2 16-16V192c0-8.8-7.2-16-16-16H144c-8.8 0-16 7.2-16 16z"/></svg><span>${escapeHtml(event.count)}枚</span></span>` : ''}
              </div>
            </div>
            <div class="text-sm font-medium text-slate-600 truncate flex items-center gap-1.5 mt-1">
              <i class="fa-solid fa-location-dot text-slate-400 text-xs shrink-0"></i>
              <span class="truncate">${escapeHtml(placeAndSection)}</span>
            </div>
          </div>
          <div class="flex items-center shrink-0 ml-1">
            <button onclick="openEventContextMenu(event, '${event.id}'); event.stopPropagation();" class="w-8 h-8 rounded-full bg-transparent text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition flex items-center justify-center">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

      currentEventId = eventId;
      switchScreen('screen-chat');

    function openAlbumModal() {
      renderAlbumPhotos();

    function renderAlbumPhotos() {
      const grid = document.getElementById('albumPhotoGrid');
      grid.innerHTML = '';
      
      const member = membersData.find(m => m.id === currentMemberId);
      if (!member) return;
      const event = member.events.find(e => e.id === currentEventId);
      if (!event || !event.photos || event.photos.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center text-slate-400 text-xs py-10">写真がありません<br>「写真を追加する」から登録できます</div>`;
        return;
      }

      event.photos.forEach((photoBase64, index) => {
        const item = document.createElement('div');
        item.className = 'relative aspect-square bg-slate-200 rounded-lg overflow-hidden cursor-pointer group';
        item.innerHTML = `
          <img src="${escapeHtml(photoBase64)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-200" alt="Album photo">
        `;
        item.onclick = () => openPhotoFullModal(index);
        grid.appendChild(item);
      });
    }

    async function addPhotosToAlbum(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      showToast('写真を追加中...');

      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      if (!event.photos) event.photos = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
          const base64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1000;
                const MAX_HEIGHT = 1000;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                  if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                  }
                } else {
                  if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                  }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          });
          event.photos.push(base64);
        } catch (err) {
          console.error('Photo load error', err);
        }
      }

      await saveDataToDB();
      hideToast();
      e.target.value = '';
      renderAlbumPhotos();
      renderEventList();
    }

    function openPhotoFullModal(index) {
      currentPhotoIndex = index;
      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      const photoUrl = event.photos[index];

      document.getElementById('photoFullElement').src = photoUrl;
      closePhotoMenu();
      const modal = document.getElementById('photoFullModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closePhotoFullModal() {
      closePhotoMenu();
      const modal = document.getElementById('photoFullModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function togglePhotoMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('photoActionMenu');
      if (menu) {
        menu.classList.toggle('hidden');
      }
    }

    function closePhotoMenu() {
      const menu = document.getElementById('photoActionMenu');
      if (menu) {
        menu.classList.add('hidden');
      }
    }

    function navigatePhoto(direction) {
      closePhotoMenu();
      const member = membersData.find(m => m.id === currentMemberId);
      if (!member) return;
      const event = member.events.find(e => e.id === currentEventId);
      if (!event || !event.photos || event.photos.length === 0) return;

      currentPhotoIndex += direction;
      if (currentPhotoIndex < 0) {
        currentPhotoIndex = event.photos.length - 1;
      } else if (currentPhotoIndex >= event.photos.length) {
        currentPhotoIndex = 0;
      }

      document.getElementById('photoFullElement').src = event.photos[currentPhotoIndex];
    }

    async function deleteCurrentPhoto() {
      if (currentPhotoIndex === null) return;
      if (!confirm('この写真を削除しますか？')) return;

      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      
      event.photos.splice(currentPhotoIndex, 1);
      await saveDataToDB();

      if (event.photos.length === 0) {
        closePhotoFullModal();

    async function saveMember() {
      const editId = document.getElementById('editMemberId').value;
      const name = document.getElementById('inputMemberName').value.trim();
      const role = document.getElementById('inputMemberRole').value.trim();
      const url = document.getElementById('inputMemberAvatarUrl').value.trim();
      if (!name) return;

      let finalAvatar = croppedAvatarBase64 || url;
      if (!finalAvatar && editId) {
        const m = membersData.find(item => item.id === editId);
        if (m) finalAvatar = m.avatar;
      }
      finalAvatar = finalAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80';

      if (url && !url.startsWith('data:')) {
        try {
          finalAvatar = await new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth || 200;
              canvas.height = img.naturalHeight || 200;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              resolve(canvas.toDataURL('image/png'));
            };
            img.onerror = () => resolve(url);
            img.src = url;
          });
        } catch (e) {}
      }

      if (editId) {
        const member = membersData.find(m => m.id === editId);
        if (member) { member.name = name; member.role = role; member.avatar = finalAvatar; }
      } else {
        membersData.push({ id: 'm_' + Date.now(), name, role: role || '', avatar: finalAvatar, events: [] });
      }

      await saveDataToDB();
      closeMemberModal();
      renderMemberList();
    }

      } else {

    async function moveMessageOrder(msgId, direction) {
      const member = membersData.find(m => m.id === currentMemberId);
      const event = member.events.find(e => e.id === currentEventId);
      const idx = event.messages.findIndex(m => m.id === msgId);
      if (idx === -1) return;

      if (direction === 'up' && idx > 0) {
        const temp = event.messages[idx];
        event.messages[idx] = event.messages[idx - 1];
        event.messages[idx - 1] = temp;
      } else if (direction === 'down' && idx < event.messages.length - 1) {
        const temp = event.messages[idx];
        event.messages[idx] = event.messages[idx + 1];
        event.messages[idx + 1] = temp;
      }
      await saveDataToDB();
      renderChatMessages();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const backup = JSON.parse(reader.result);
          const importedMembers = Array.isArray(backup) ? backup : backup.members;
          if (!Array.isArray(importedMembers)) throw new Error();
          if (!confirm('現在のすべてのデータを置き換えます。よろしいですか？')) return;

          showToast('バックアップを読み込み中...');

          for (let member of importedMembers) {
            if (member.events) {
              member.events.forEach(ev => {
                if (!ev.photos) ev.photos = [];
              });
            }
            if (member.avatar && !member.avatar.startsWith('data:')) {
              try {
                member.avatar = await new Promise((resolve) => {
                  const img = new Image();
                  img.crossOrigin = 'anonymous';
                  img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 200;
                    canvas.height = img.naturalHeight || 200;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                  };
                  img.onerror = () => resolve(member.avatar);
                  img.src = member.avatar;
                });
              } catch (e) {}
            }
          }

          membersData = importedMembers;
          currentMemberId = null;
          currentEventId = null;
          await saveDataToDB();
          switchScreen('screen-members');
          showToast('バックアップを読み込みました');
          setTimeout(hideToast, 2000);
        } catch (e) {
          hideToast();
          alert('ファイルを読み込めませんでした。');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function exportChatImage() {
      const captureElement = document.getElementById('captureArea');
      const mainAppContainer = document.getElementById('mainAppContainer');
      const chatScreen = document.getElementById('screen-chat');
      const messagesContainer = document.getElementById('chatMessages');
      if (!captureElement) return;

      showToast('画像を生成中...');

      const images = captureElement.querySelectorAll('img');
      const imagePromises = Array.from(images).map(img => {
        return new Promise(async (resolve) => {
          if (!img.src) {
            resolve();
            return;
          }
          if (img.src.startsWith('data:')) {
            if (img.complete && img.naturalHeight !== 0) {
              resolve();
            } else {
              img.onload = resolve;
              img.onerror = resolve;
              setTimeout(resolve, 1500);
            }
            return;
          }

          try {
            const res = await fetch(img.src, { mode: 'cors' });
            const blob = await res.blob();
            const reader = new FileReader();
            reader.onloadend = () => {
              img.src = reader.result;
              resolve();
            };
            reader.onerror = resolve;
            reader.readAsDataURL(blob);
          } catch (err) {
            const image = new Image();
            image.crossOrigin = 'anonymous';
            image.onload = () => {
              try {
                const canvas = document.createElement('canvas');
                canvas.width = image.naturalWidth || image.width;
                canvas.height = image.naturalHeight || image.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0);
                img.src = canvas.toDataURL('image/png');
              } catch (e) {}
              resolve();
            };
            image.onerror = resolve;
            image.src = img.src;
          }
        });
      });

      Promise.all(imagePromises).then(() => {
        const origMainHeight = mainAppContainer.style.height;
        const origScreenHeight = chatScreen.style.height;
        const origCaptureHeight = captureElement.style.height;
        const origMsgHeight = messagesContainer.style.height;
        const origMsgOverflow = messagesContainer.style.overflow;

        mainAppContainer.style.height = 'auto';
        chatScreen.style.height = 'auto';
        captureElement.style.height = 'auto';
        messagesContainer.style.height = messagesContainer.scrollHeight + 'px';
        messagesContainer.style.overflow = 'visible';

        setTimeout(() => {
          htmlToImage.toPng(captureElement, { cacheBust: true, pixelRatio: 2, fontEmbedCSS: '' })
            .then((dataUrl) => {
              mainAppContainer.style.height = origMainHeight;
              chatScreen.style.height = origScreenHeight;
              captureElement.style.height = origCaptureHeight;
              messagesContainer.style.height = origMsgHeight;
              messagesContainer.style.overflow = origMsgOverflow;

              hideToast();
              const modal = document.getElementById('imagePreviewModal');
              document.getElementById('previewImageElement').src = dataUrl;
              modal.classList.remove('hidden');
              modal.classList.add('flex');
            })
            .catch(() => {
              mainAppContainer.style.height = origMainHeight;
              chatScreen.style.height = origScreenHeight;
              captureElement.style.height = origCaptureHeight;
              messagesContainer.style.height = origMsgHeight;
              messagesContainer.style.overflow = origMsgOverflow;
              hideToast();
              showToast('画像の保存に失敗しました');
              setTimeout(hideToast, 2000);
            });
        }, 200);
      });
    }

    function closeImagePreviewModal() {
      const modal = document.getElementById('imagePreviewModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    const buttons = document.querySelectorAll('.track-btn');

    buttons.forEach(button => {
      button.addEventListener('click', function() {
        const buttonName = this.getAttribute('data-button-name');
        gtag('event', 'button_click', {
          'button_name': buttonName,
          'page_location': window.location.href
        });
      });
    });

    initDB()
      .then(async () => {
        await migrateLocalStorageIfNeeded();
        await loadDataFromDB();
        renderMemberList();
      })
      .catch(err => {
        console.error('IndexedDB initialization failed:', err);
        showToast('データベースの初期化に失敗しました');
      });
  </script>
</body>
</html>
