<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="./icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --text-main: #334155;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-touch-callout: default;
      -webkit-user-select: none;
      user-select: none;
      min-height: 100dvh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .app-bg {
      background-color: var(--bg-color);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .mail-content-text {
      line-height: 1.7;
      word-break: break-word;
      text-align: left;
      white-space: pre-wrap;
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .dragging {
      opacity: 0.4;
      background: #e2e8f0 !important;
    }
    .drag-over {
      border-top: 2px dashed #6366f1 !important;
    }
  </style>
</head>
<body class="app-bg font-sans antialiased text-slate-800 flex items-center justify-center p-0 sm:p-4">

  <div id="mainAppContainer" class="app-bg w-full sm:max-w-md h-full sm:h-[844px] sm:rounded-[40px] sm:shadow-2xl flex flex-col overflow-hidden relative">

    <div id="screen-shows" class="screen active">
      <div class="p-4 bg-transparent flex items-center justify-between relative shrink-0 z-10 h-16">
        <div class="relative">
          <button onclick="toggleGlobalMenu(event)" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 hover:bg-white/70 hover:text-slate-700 transition" aria-label="メニュー">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div id="globalContextMenu" class="absolute left-0 mt-1 hidden bg-white rounded-xl shadow-xl py-1 z-50 text-xs w-52 overflow-hidden border border-slate-100 whitespace-nowrap">
            <button onclick="exportBackup(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-file-export text-slate-400 w-4"></i> バックアップを書き出す
            </button>
            <button onclick="document.getElementById('backupImportInput').click(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-file-import text-slate-400 w-4"></i> バックアップを読み込む
            </button>
            <button onclick="location.reload(); closeAllContextMenus();" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
              <i class="fa-solid fa-rotate-right text-slate-400 w-4"></i> ページを再読み込み
            </button>
          </div>
          <input type="file" id="backupImportInput" accept="application/json,.json" class="hidden" onchange="importBackup(event)">
        </div>
        <h1 class="text-lg font-bold text-slate-800 absolute left-1/2 -translate-x-1/2"></h1>
        <button onclick="openShowModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="番組追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="px-4 py-2 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-slate-400 text-xs"></i>
          <input type="text" id="searchShow" placeholder="番組を検索" class="w-full bg-white text-xs pl-9 pr-3 py-2 rounded-xl shadow-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>

      <div class="flex-1 overflow-y-auto px-3 divide-y divide-slate-200/40 pb-4" id="showList" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <div id="screen-episodes" class="screen">
      <div class="p-4 flex items-center justify-between relative shrink-0 z-10 h-16">
        <button onclick="switchScreen('screen-shows')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="absolute left-1/2 -translate-x-1/2 text-center max-w-[180px]">
          <h1 class="font-bold text-slate-800 truncate" id="episodeScreenTitleHeader">#ハッシュタグ</h1>
        </div>
        <button onclick="openEpisodeModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-600 hover:bg-white/70 hover:text-slate-900 transition" aria-label="放送回追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="px-4 py-2 shrink-0">
        <div class="flex items-center gap-2 mb-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-slate-400 text-xs"></i>
            <input type="text" id="searchEpisode" placeholder="放送回を検索" class="w-full bg-white text-xs pl-9 pr-3 py-2 rounded-xl shadow-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
          <div class="relative shrink-0">
            <select id="fiscalYearFilter" onchange="onFiscalYearFilterChange()" class="bg-white text-xs font-bold text-slate-700 pl-3 pr-8 py-2 rounded-xl shadow-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition appearance-none cursor-pointer">
              <option value="all">すべて</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-[10px] text-slate-400 pointer-events-none"></i>
          </div>
        </div>
        <!-- 採用数合計 -->
        <div onclick="openCornerSummaryModal()" class="px-3.5 py-3 bg-indigo-50 hover:bg-indigo-100/70 active:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold flex items-center justify-between cursor-pointer transition shadow-sm border border-indigo-100">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-indigo-500"></i>
            <span id="episodeTotalCountLabel">採用数合計（すべて）</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="episodeTotalCountValue" class="text-sm">0通</span>
            <i class="fa-solid fa-chevron-right text-[10px] text-indigo-400"></i>
          </div>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto px-3 divide-y divide-slate-200/40 pb-4" id="episodeList" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <div id="screen-chat" class="screen">
      <!-- ヘルパーの高さ（h-16）を追加して他の画面と高さを統一 -->
      <div class="p-4 flex items-center justify-between relative shrink-0 z-10 h-16">
        <button onclick="switchScreen('screen-episodes')" class="text-slate-600 hover:text-slate-900 text-lg px-2">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="absolute left-1/2 -translate-x-1/2 text-center max-w-[180px]">
          <h1 class="font-bold text-slate-800 truncate" id="chatScreenTitle">#ハッシュタグ</h1>
        </div>
        <div class="w-9"></div>
      </div>

      <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <div id="captureArea" class="flex-1 flex flex-col min-h-0 app-bg overflow-hidden pt-2">
          <div class="pt-3 pb-3 px-4 shrink-0 bg-white/80 mx-3 rounded-2xl shadow-sm border border-slate-200/60 flex items-center justify-between">
            <div class="min-w-0 pr-2">
              <div class="text-sm font-bold text-slate-800 truncate" id="chatEpisodeTitle">2026-04-29</div>
              <div class="text-[12px] text-slate-500 truncate leading-tight mt-0.5" id="chatScreenRadioName"></div>
              <div class="text-[12px] text-slate-400 truncate leading-tight hidden" id="chatShowHashtag">番組名</div>
            </div>
            <div class="text-right text-[11px] shrink-0 font-semibold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800">採用メール</div>
          </div>

          <div class="flex-1 p-3 overflow-y-auto space-y-3 min-h-0" id="chatMessages" style="-webkit-overflow-scrolling: touch;"></div>
        </div>
      </div>

      <!-- 送信エリアを同一ボックス内に統合 -->
      <div id="inputAreaContainer" class="px-4 pt-2.5 pb-[calc(env(safe-area-inset-bottom,16px)+8px)] bg-transparent shrink-0 z-10 transition-all duration-200">
        <div id="inputContentWrapper" class="flex flex-col gap-2 bg-white/90 p-2.5 rounded-2xl shadow-sm border border-slate-200/60">
          <div class="flex items-center gap-2">
            <input type="text" id="cornerInput" placeholder="コーナー名（例: ひと言 / フリートーク）" class="flex-1 bg-slate-100/80 text-xs px-3 py-2 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <button onclick="toggleInputArea()" id="toggleInputBtn" class="text-xs text-slate-500 hover:text-slate-700 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 font-medium shrink-0 ml-auto bg-slate-100/80 hover:bg-slate-100/80">
              <span id="toggleText">非表示</span> <i id="toggleIcon" class="fa-solid fa-caret-down text-[10px]"></i>
            </button>
          </div>
          <div id="collapsibleInputBody" class="flex flex-col gap-2">
            <textarea id="messageInput" rows="3" placeholder="採用されたメールの内容を入力..." class="w-full bg-slate-100/80 text-sm px-3.5 py-2 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-none"></textarea>
            <div class="flex items-center gap-2">
              <input type="text" id="reactionInput" placeholder="パーソナリティの反応や感想（任意）" class="flex-1 bg-slate-100/80 text-xs px-3 py-2 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              <button onclick="sendMessage()" class="text-indigo-600 hover:text-indigo-800 px-2 text-2xl flex items-center justify-center shrink-0">
                <i class="fa-solid fa-circle-arrow-up"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- コーナー毎の集計モーダル -->
  <div id="cornerSummaryModal" onclick="if(event.target === this) closeCornerSummaryModal();" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[9999]">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
        <div>
          <h3 class="text-base font-bold text-slate-800">コーナー別 採用数集計</h3>
          <p id="cornerSummarySubTitle" class="text-xs text-slate-500 mt-0.5">すべての集計</p>
        </div>
        <button onclick="closeCornerSummaryModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div id="cornerSummaryList" class="flex-1 overflow-y-auto space-y-2 pr-1 divide-y divide-slate-100"></div>
    </div>
  </div>

  <!-- 番組追加・編集モーダル（トリミング対応） -->
  <div id="showModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[9999]">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="showModalTitle">番組を追加</h3>
      <input type="hidden" id="editShowId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">番組アイコン（任意）</label>
          <div class="flex items-center gap-3">
            <div id="showIconPreviewContainer" class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center overflow-hidden shrink-0 border border-slate-200">
              <i class="fa-solid fa-radio text-lg" id="showIconPreviewDefault"></i>
              <img id="cropResultPreview" class="w-full h-full object-cover hidden" alt="Preview">
            </div>
            <div class="flex-1 flex flex-col gap-1">
              <input type="file" id="iconImageInput" accept="image/*" class="hidden">
              <div class="flex items-center gap-2">
                <button type="button" onclick="document.getElementById('iconImageInput').click()" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition">画像を選択</button>
                <button type="button" id="removeShowIconBtn" onclick="removeShowIcon()" class="px-2 py-1.5 text-xs text-red-500 hover:bg-red-50 rounded-lg transition hidden">削除</button>
              </div>
            </div>
          </div>

          <div id="cropperContainer" class="hidden mt-3 bg-slate-900 p-2 rounded-xl">
            <div class="max-h-48 overflow-hidden flex items-center justify-center">
              <img id="cropperImage" src="" alt="Cropper preview" class="max-w-full">
            </div>
            <button type="button" id="cropButton" class="mt-2 w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs transition">
              確定
            </button>
          </div>

          <input type="hidden" id="inputShowIconBase64">
        </div>

        <div>
          <label class="block text-xs text-slate-500 mb-1">番組名</label>
          <input type="text" id="inputShowName" placeholder="例: レコメン！" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">ラジオネーム</label>
          <input type="text" id="inputRadioName" placeholder="例: ラジオネームを入力" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">番組ハッシュタグ</label>
          <input type="text" id="inputShowHashtag" placeholder="例: #レコメン" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">パーソナリティ</label>
          <input type="text" id="inputShowPersonality" placeholder="例: 矢吹奈子" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">放送局</label>
          <input type="text" id="inputShowStation" placeholder="例: 文化放送" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex items-center justify-between mt-5">
        <button type="button" id="deleteShowBtnInModal" onclick="deleteShowFromModal()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg hidden">削除</button>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="closeShowModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveShow()" data-button-name="add_program" class="track-btn px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="episodeModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[9999]">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl relative">
      <h3 class="text-base font-bold text-slate-800 mb-4" id="episodeModalTitle">放送回を追加</h3>
      <input type="hidden" id="editEpisodeId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">放送日</label>
          <div class="relative">
            <input type="text" id="inputEpisodeDate" readonly placeholder="YYYY-MM-DD" onclick="openCustomCalendar()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 pr-9 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
            <button type="button" onclick="openCustomCalendar()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600">
              <i class="fa-regular fa-calendar-days text-base"></i>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">メモ（任意）</label>
          <input type="text" id="inputEpisodeMemo" placeholder="例: スペシャルウィーク / 初採用など" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex items-center justify-between mt-5">
        <button type="button" id="deleteEpisodeBtnInModal" onclick="deleteEpisodeFromModal()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg hidden">削除</button>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="closeEpisodeModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveEpisode()" data-button-name="add_episode" class="track-btn px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="customCalendarModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[10000]">
    <div class="bg-white rounded-2xl w-full max-w-xs p-4 shadow-2xl">
      <div class="flex items-center justify-between mb-3 px-1">
        <button type="button" onclick="changeMonth(-1)" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-chevron-left text-xs"></i></button>
        <h4 id="calCurrentMonthTitle" class="text-sm font-bold text-slate-800">2026年 4月</h4>
        <button type="button" onclick="changeMonth(1)" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-chevron-right text-xs"></i></button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-2">
        <span class="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-blue-500">土</span>
      </div>
      <div id="calDaysGrid" class="grid grid-cols-7 gap-1 text-center text-xs h-[240px] content-start"></div>
      <div class="mt-4 flex justify-end">
        <button type="button" onclick="closeCustomCalendar()" class="px-4 py-1.5 text-xs bg-slate-100 text-slate-600 font-medium rounded-xl hover:bg-slate-200">閉じる</button>
      </div>
    </div>
  </div>

  <div id="msgEditModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center p-4 z-[9999]">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
      <h3 class="text-base font-bold text-slate-800 mb-4">採用メールの編集</h3>
      <input type="hidden" id="editMsgId">
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-500 mb-1">コーナー名</label>
          <input type="text" id="editCornerText" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">採用メール内容</label>
          <textarea id="editMsgText" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">パーソナリティの反応や感想（任意）</label>
          <input type="text" id="editReactionText" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
      </div>
      <div class="flex items-center justify-end mt-5">
        <div class="flex items-center gap-2">
          <button onclick="closeMsgEditModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
          <button onclick="saveEditedMessage()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="msgActionMenu" class="fixed hidden bg-white rounded-xl shadow-xl py-1 z-[9999] text-xs w-40 overflow-hidden border border-slate-100">
    <button onclick="msgAction('edit')" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集する
    </button>
    <button onclick="msgAction('up')" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-arrow-up text-slate-400 w-4"></i> 上へ移動
    </button>
    <button onclick="msgAction('down')" class="w-full text-left px-3 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-arrow-down text-slate-400 w-4"></i> 下へ移動
    </button>
    <button onclick="msgAction('delete')" class="w-full text-left px-3 py-2.5 hover:bg-red-50 flex items-center gap-2 text-red-600 border-t border-slate-100">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除する
    </button>
  </div>

  <div id="showContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl py-1 z-[9999] text-xs w-36 overflow-hidden">
    <button onclick="showContextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="showContextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <div id="episodeContextMenu" class="fixed hidden bg-white rounded-xl shadow-xl py-1 z-[9999] text-xs w-36 overflow-hidden">
    <button onclick="episodeContextAction('edit')" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2 text-slate-700">
      <i class="fa-solid fa-pen text-slate-400 w-4"></i> 編集
    </button>
    <button onclick="episodeContextAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2 text-red-600">
      <i class="fa-solid fa-trash text-red-400 w-4"></i> 削除
    </button>
  </div>

  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-[10000] flex items-center gap-2">
    <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
    <span id="toastMsg">処理中...</span>
  </div>

  <!-- Cropper.js JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    let db = null;
    let showsData = [];
    let currentShowId = null;
    let currentEpisodeId = null;
    let selectedShowIdForContext = null;
    let selectedEpisodeIdForContext = null;
    let selectedMsgIdForContext = null;
    let isInputAreaVisible = true;

    let cropper = null;
    let croppedAvatarBase64 = '';

    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    function getFiscalYear(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('-');
      if (parts.length < 3) return null;
      return parseInt(parts[0], 10);
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('RadioMailLogDB', 10);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('appData')) {
            database.createObjectStore('appData');
          }
        };
      });
    }

    function loadDataFromDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['appData'], 'readonly');
        const store = transaction.objectStore('appData');
        const request = store.get('shows');
        request.onsuccess = () => {
          showsData = request.result || [];
          showsData.forEach(show => {
            if (typeof show.radioName === 'undefined') {
              show.radioName = '';
            }
            if (typeof show.icon === 'undefined') {
              show.icon = '';
            }
          });
          resolve(showsData);
        };
        request.onerror = () => reject(request.error);
      });
    }

    function saveDataToDB() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['appData'], 'readwrite');
        const store = transaction.objectStore('appData');
        const request = store.put(showsData, 'shows');
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-shows') renderShowList();
      if (screenId === 'screen-episodes') {
        updateFiscalYearFilterOptions();
        renderEpisodeList();
      }
      if (screenId === 'screen-chat') renderChatMessages();
    }

    let touchStartXCoord = 0;
    let touchStartYCoord = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartXCoord = e.touches[0].clientX;
        touchStartYCoord = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const touchEndXCoord = e.changedTouches[0].clientX;
        const touchEndYCoord = e.changedTouches[0].clientY;
        const diffX = touchEndXCoord - touchStartXCoord;
        const diffY = touchEndYCoord - touchStartYCoord;

        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
          const activeScreen = document.querySelector('.screen.active');
          if (!activeScreen) return;

          if (document.getElementById('customCalendarModal').classList.contains('flex') ||
              document.getElementById('showModal').classList.contains('flex') ||
              document.getElementById('episodeModal').classList.contains('flex') ||
              document.getElementById('cornerSummaryModal').classList.contains('flex') ||
              document.getElementById('msgEditModal').classList.contains('flex')) {
            return;
          }

          if (activeScreen.id === 'screen-episodes') {
            if (diffX > 0) {
              switchScreen('screen-shows');
            }
          } else if (activeScreen.id === 'screen-chat') {
            if (diffX > 0) {
              switchScreen('screen-episodes');
            }
          }
        }
      }
    }, { passive: true });

    function toggleInputArea() {
      isInputAreaVisible = !isInputAreaVisible;
      const cornerInput = document.getElementById('cornerInput');
      const collapsibleBody = document.getElementById('collapsibleInputBody');
      const wrapper = document.getElementById('inputContentWrapper');
      const btnText = document.getElementById('toggleText');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (isInputAreaVisible) {
        cornerInput.style.display = 'block';
        collapsibleBody.style.display = 'flex';
        wrapper.className = 'flex flex-col gap-2 bg-white/90 p-2.5 rounded-2xl shadow-sm border border-slate-200/60';
        btnText.textContent = '非表示';
        toggleIcon.className = 'fa-solid fa-caret-down text-[10px]';
      } else {
        cornerInput.style.display = 'none';
        collapsibleBody.style.display = 'none';
        wrapper.className = 'flex flex-col gap-2 bg-transparent p-0 rounded-none shadow-none border-0';
        btnText.textContent = '表示';
        toggleIcon.className = 'fa-solid fa-caret-up text-[10px]';
      }
    }

    function toggleGlobalMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('globalContextMenu');
      closeAllContextMenus();
      menu.classList.toggle('hidden');
    }

    function closeAllContextMenus() {
      const menu = document.getElementById('globalContextMenu');
      if (menu) menu.classList.add('hidden');
      const sMenu = document.getElementById('showContextMenu');
      if (sMenu) sMenu.classList.add('hidden');
      const eMenu = document.getElementById('episodeContextMenu');
      if (eMenu) eMenu.classList.add('hidden');
      const msgMenu = document.getElementById('msgActionMenu');
      if (msgMenu) msgMenu.classList.add('hidden');
    }
    document.addEventListener('click', () => closeAllContextMenus());

    function renderShowList(filter = '') {
      const listEl = document.getElementById('showList');
      listEl.innerHTML = '';
      const filtered = showsData.filter(s => s.name.includes(filter) || (s.hashtag && s.hashtag.includes(filter)) || (s.radioName && s.radioName.includes(filter)) || (s.personality && s.personality.includes(filter)) || (s.station && s.station.includes(filter)));

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">番組がまだ登録されていません。</div>`;
        return;
      }

      filtered.forEach((show) => {
        const item = document.createElement('div');
        item.className = 'py-3.5 px-3 bg-white mb-2 rounded-2xl shadow-sm border border-slate-200/60 flex items-center justify-between transition group';
        item.dataset.id = show.id;

        let iconHtml = '';
        if (show.icon) {
          iconHtml = `<img src="${escapeHtml(show.icon)}" class="w-full h-full object-cover rounded-xl" alt="Icon">`;
        } else {
          iconHtml = `<i class="fa-solid fa-radio"></i>`;
        }

        let metaParts = [];
        if (show.personality) metaParts.push(escapeHtml(show.personality));
        if (show.station) metaParts.push(escapeHtml(show.station));
        const subInfoHtml = metaParts.length > 0 ? `<div class="text-xs text-slate-500 truncate mt-0.5">${metaParts.join(' / ')}</div>` : '';

        item.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <div class="flex items-center gap-3.5 flex-1 min-w-0 cursor-pointer" onclick="selectShow('${show.id}')">
              <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 overflow-hidden">
                ${iconHtml}
              </div>
              <div class="truncate flex-1 min-w-0">
                <h3 class="text-sm font-bold text-slate-800 truncate">${escapeHtml(show.name)}</h3>
                ${subInfoHtml}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 ml-2 shrink-0">
            <button onclick="openShowContextMenu(event, '${show.id}'); event.stopPropagation();" class="w-8 h-8 rounded-full bg-slate-50 text-slate-500 hover:text-slate-700 transition flex items-center justify-center">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function selectShow(showId) {
      currentShowId = showId;
      const show = showsData.find(s => s.id === showId);
      document.getElementById('episodeScreenTitleHeader').textContent = show.hashtag || show.name;
      document.getElementById('fiscalYearFilter').value = 'all';
      switchScreen('screen-episodes');
    }

    function updateFiscalYearFilterOptions() {
      const selectEl = document.getElementById('fiscalYearFilter');
      const currentValue = selectEl.value;
      const show = showsData.find(s => s.id === currentShowId);
      if (!show) return;

      const fySet = new Set();
      show.episodes.forEach(ep => {
        const fy = getFiscalYear(ep.date);
        if (fy !== null) fySet.add(fy);
      });

      const sortedFys = Array.from(fySet).sort((a, b) => b - a);

      selectEl.innerHTML = '<option value="all">すべて</option>';
      sortedFys.forEach(fy => {
        const opt = document.createElement('option');
        opt.value = fy;
        opt.textContent = `${fy}年`;
        selectEl.appendChild(opt);
      });

      if (sortedFys.includes(Number(currentValue)) || currentValue === 'all') {
        selectEl.value = currentValue;
      } else {
        selectEl.value = 'all';
      }
    }

    function onFiscalYearFilterChange() {
      renderEpisodeList(document.getElementById('searchEpisode').value.trim());
    }

    function renderEpisodeList(filter = '') {
      const listEl = document.getElementById('episodeList');
      listEl.innerHTML = '';
      const show = showsData.find(s => s.id === currentShowId);
      if (!show) return;

      const selectedFy = document.getElementById('fiscalYearFilter').value;

      const filtered = show.episodes.filter(ep => {
        const fy = getFiscalYear(ep.date);
        const matchesFy = (selectedFy === 'all') || (fy !== null && fy.toString() === selectedFy);
        const matchesSearch = (ep.date || '').includes(filter) || (ep.memo && ep.memo.includes(filter));
        return matchesFy && matchesSearch;
      });

      const totalMails = filtered.reduce((acc, ep) => acc + ep.messages.length, 0);
      document.getElementById('episodeTotalCountValue').textContent = totalMails + '通';
      document.getElementById('episodeTotalCountLabel').textContent = selectedFy === 'all' ? '採用数合計' : `採用数合計（${selectedFy}年）`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">放送回がまだ登録されていません</div>`;
        return;
      }

      filtered.forEach((episode) => {
        const item = document.createElement('div');
        item.className = 'py-3.5 px-3 bg-white mb-2 rounded-2xl shadow-sm border border-slate-200/60 flex items-center justify-between transition group';
        item.dataset.id = episode.id;

        const mailCount = episode.messages.length;
        const dateHtml = `<span class="text-sm font-bold text-slate-800 shrink-0">${escapeHtml(episode.date || '日付未設定')}</span>`;
        const memoHtml = episode.memo ? `
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[11px] font-medium truncate max-w-[180px]">
            <span class="truncate">${escapeHtml(episode.memo)}</span>
          </span>
        ` : '';
        
        let headerRowContent = `<div class="flex items-center gap-2.5 min-w-0 flex-1 pr-2">${dateHtml}${memoHtml}</div>`;

        const uniqueCorners = [];
        episode.messages.forEach(msg => {
          const cornerName = (msg.corner && msg.corner.trim() !== '') ? msg.corner.trim() : '';
          if (cornerName && !uniqueCorners.includes(cornerName)) {
            uniqueCorners.push(cornerName);
          }
        });

        let cornersDisplay = '';
        if (uniqueCorners.length > 0) {
          const cornerBadges = uniqueCorners.map(c => `<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-[10px] font-bold mr-1 mb-1">${escapeHtml(c)}</span>`).join('');
          cornersDisplay = `<div class="flex flex-wrap items-center mt-2.5">${cornerBadges}</div>`;
        }

        item.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <div class="flex-1 min-w-0 cursor-pointer pl-1" onclick="selectEpisode('${episode.id}')">
              <div class="flex items-center justify-between mb-0.5">
                ${headerRowContent}
                <div class="text-right text-xs text-slate-500 shrink-0">
                  ${mailCount > 0 ? `<span class="bg-amber-50 text-amber-700 font-semibold px-2.5 py-0.5 rounded-md inline-flex items-center"><i class="fa-solid fa-envelope text-[10px] mr-1"></i>${mailCount}</span>` : ''}
                </div>
              </div>
              ${cornersDisplay}
            </div>
          </div>
          <div class="flex items-center gap-1.5 ml-2 shrink-0">
            <button onclick="openEpisodeContextMenu(event, '${episode.id}'); event.stopPropagation();" class="w-8 h-8 rounded-full bg-slate-50 text-slate-500 hover:text-slate-700 transition flex items-center justify-center">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function openCornerSummaryModal() {
      const show = showsData.find(s => s.id === currentShowId);
      if (!show) return;

      const selectedFy = document.getElementById('fiscalYearFilter').value;
      const subTitleEl = document.getElementById('cornerSummarySubTitle');
      subTitleEl.textContent = selectedFy === 'all' ? `すべて` : `${selectedFy}年`;

      const targetEpisodes = show.episodes.filter(ep => {
        const fy = getFiscalYear(ep.date);
        return (selectedFy === 'all') || (fy !== null && fy.toString() === selectedFy);
      });

      const cornerCounts = {};
      let totalCount = 0;

      targetEpisodes.forEach(ep => {
        ep.messages.forEach(msg => {
          const cornerName = (msg.corner && msg.corner.trim() !== '') ? msg.corner.trim() : 'その他';
          cornerCounts[cornerName] = (cornerCounts[cornerName] || 0) + 1;
          totalCount++;
        });
      });

      const sortedCorners = Object.entries(cornerCounts).sort((a, b) => b[1] - a[1]);

      const listContainer = document.getElementById('cornerSummaryList');
      listContainer.innerHTML = '';

      if (sortedCorners.length === 0) {
        listContainer.innerHTML = `<div class="py-8 text-center text-slate-400 text-xs">採用メールのデータがありません</div>`;
      } else {
        sortedCorners.forEach(([corner, count]) => {
          const percentage = totalCount > 0 ? Math.round((count / totalCount) * 100) : 0;
          const row = document.createElement('div');
          row.className = 'py-2.5 flex items-center justify-between text-xs';
          row.innerHTML = `
            <div class="flex items-center gap-2 min-w-0 flex-1 pr-2">
              <span class="w-2 h-2 rounded-full bg-indigo-500 shrink-0"></span>
              <span class="font-bold text-slate-700 truncate">${escapeHtml(corner)}</span>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-slate-400 text-[11px]">${percentage}%</span>
              <span class="font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg">${count}通</span>
            </div>
          `;
          listContainer.appendChild(row);
        });
      }

      const modal = document.getElementById('cornerSummaryModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCornerSummaryModal() {
      const modal = document.getElementById('cornerSummaryModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function selectEpisode(episodeId) {
      currentEpisodeId = episodeId;
      switchScreen('screen-chat');
    }

    function renderChatMessages() {
      const show = showsData.find(s => s.id === currentShowId);
      if (!show) return;
      const episode = show.episodes.find(e => e.id === currentEpisodeId);
      if (!episode) return;

      document.getElementById('chatScreenTitle').textContent = show.hashtag || show.name;
      document.getElementById('chatScreenRadioName').textContent = show.radioName ? `ラジオネーム：${show.radioName}` : '';
      document.getElementById('chatEpisodeTitle').textContent = episode.date || '日付未設定';
      document.getElementById('chatShowHashtag').textContent = show.name;

      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = '';

      if (episode.messages.length === 0) {
        messagesContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">採用メールがまだ登録されていません</div>`;
        return;
      }

      episode.messages.forEach((msg) => {
        const msgEl = document.createElement('div');
        msgEl.className = 'bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200/60 relative group';

        const cornerBadge = msg.corner ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-[10px] font-bold mb-1.5">${escapeHtml(msg.corner)}</span>` : '';
        const reactionSection = msg.reaction ? `<div class="mt-2.5 pt-2 border-t border-slate-100 text-xs text-slate-600 flex items-start gap-1.5"><i class="fa-solid fa-comment-dots text-amber-500 mt-0.5 shrink-0"></i><div class="mail-content-text flex-1">${escapeHtml(msg.reaction)}</div></div>` : '';

        msgEl.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex-1 min-w-0">
              ${cornerBadge}
              <div class="text-sm text-slate-800 mail-content-text">${escapeHtml(msg.text)}</div>
              ${reactionSection}
            </div>
            <button onclick="openMsgActionMenu(event, '${msg.id}');" class="w-7 h-7 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition flex items-center justify-center shrink-0">
              <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>
          </div>
        `;
        messagesContainer.appendChild(msgEl);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function openCustomCalendar() {
      const dateInputVal = document.getElementById('inputEpisodeDate').value;
      if (dateInputVal) {
        const parts = dateInputVal.split('-');
        if (parts.length === 3) {
          calYear = parseInt(parts[0], 10);
          calMonth = parseInt(parts[1], 10) - 1;
        }
      } else {
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
      }
      renderCalendarGrid();
      const calModal = document.getElementById('customCalendarModal');
      calModal.classList.remove('hidden');
      calModal.classList.add('flex');
    }

    function closeCustomCalendar() {
      const calModal = document.getElementById('customCalendarModal');
      calModal.classList.remove('flex');
      calModal.classList.add('hidden');
    }

    function changeMonth(direction) {
      calMonth += direction;
      if (calMonth > 11) {
        calMonth = 0;
        calYear++;
      } else if (calMonth < 0) {
        calMonth = 11;
        calYear--;
      }
      renderCalendarGrid();
    }

    function renderCalendarGrid() {
      const titleEl = document.getElementById('calCurrentMonthTitle');
      titleEl.textContent = `${calYear}年 ${calMonth + 1}月`;

      const gridEl = document.getElementById('calDaysGrid');
      gridEl.innerHTML = '';

      const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
      const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
      const currentDateVal = document.getElementById('inputEpisodeDate').value;

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        gridEl.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay; day++) {
        const yyyy = calYear;
        const mm = String(calMonth + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;

        const dayCell = document.createElement('button');
        dayCell.type = 'button';
        dayCell.className = `w-8 h-8 mx-auto rounded-full flex items-center justify-center text-xs transition font-medium ${dateStr === currentDateVal ? 'bg-indigo-600 text-white font-bold' : 'hover:bg-slate-100 text-slate-700'}`;
        dayCell.textContent = day;
        dayCell.onclick = () => {
          document.getElementById('inputEpisodeDate').value = dateStr;
          closeCustomCalendar();
        };
        gridEl.appendChild(dayCell);
      }
    }

    document.getElementById('iconImageInput').addEventListener('change', (e) => {
      const files = e.target.files;
      if (files && files.length > 0) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const cropperImage = document.getElementById('cropperImage');
          cropperImage.src = event.target.result;
          
          document.getElementById('cropperContainer').classList.remove('hidden');
          
          if (cropper) {
            cropper.destroy();
          }
          
          cropper = new Cropper(cropperImage, {
            aspectRatio: 1,
            viewMode: 1,
          });
        };
        reader.readAsDataURL(files[0]);
      }
    });

    document.getElementById('cropButton').addEventListener('click', executeCrop);

    function executeCrop() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({
        width: 200,
        height: 200,
      });
      croppedAvatarBase64 = canvas.toDataURL('image/png');
      
      const preview = document.getElementById('cropResultPreview');
      preview.src = croppedAvatarBase64;
      preview.classList.remove('hidden');
      document.getElementById('showIconPreviewDefault').classList.add('hidden');
      document.getElementById('removeShowIconBtn').classList.remove('hidden');
      document.getElementById('inputShowIconBase64').value = croppedAvatarBase64;

      document.getElementById('cropperContainer').classList.add('hidden');
      showToast('画像を切り抜きました');
      setTimeout(hideToast, 1500);
    }

    function updateShowIconPreview(iconSrc) {
      const defaultIcon = document.getElementById('showIconPreviewDefault');
      const previewImg = document.getElementById('cropResultPreview');
      const removeBtn = document.getElementById('removeShowIconBtn');

      if (iconSrc) {
        defaultIcon.classList.add('hidden');
        previewImg.src = iconSrc;
        previewImg.classList.remove('hidden');
        removeBtn.classList.remove('hidden');
        croppedAvatarBase64 = iconSrc;
        document.getElementById('inputShowIconBase64').value = iconSrc;
      } else {
        defaultIcon.classList.remove('hidden');
        previewImg.src = '';
        previewImg.classList.add('hidden');
        removeBtn.classList.add('hidden');
        croppedAvatarBase64 = '';
        document.getElementById('inputShowIconBase64').value = '';
        document.getElementById('iconImageInput').value = '';
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        document.getElementById('cropperContainer').classList.add('hidden');
      }
    }

    function removeShowIcon() {
      updateShowIconPreview('');
    }

    function openShowModal(showId = null) {
      const modal = document.getElementById('showModal');
      const title = document.getElementById('showModalTitle');
      const editId = document.getElementById('editShowId');
      const nameInput = document.getElementById('inputShowName');
      const radioNameInput = document.getElementById('inputRadioName');
      const hashtagInput = document.getElementById('inputShowHashtag');
      const personalityInput = document.getElementById('inputShowPersonality');
      const stationInput = document.getElementById('inputShowStation');
      const deleteBtn = document.getElementById('deleteShowBtnInModal');

      if (showId) {
        const show = showsData.find(s => s.id === showId);
        title.textContent = '番組を編集';
        editId.value = show.id;
        nameInput.value = show.name;
        radioNameInput.value = show.radioName || '';
        hashtagInput.value = show.hashtag || '';
        personalityInput.value = show.personality || '';
        stationInput.value = show.station || '';
        updateShowIconPreview(show.icon || '');
        deleteBtn.classList.remove('hidden');
      } else {
        title.textContent = '番組を追加';
        editId.value = '';
        nameInput.value = '';
        radioNameInput.value = '';
        hashtagInput.value = '';
        personalityInput.value = '';
        stationInput.value = '';
        updateShowIconPreview('');
        deleteBtn.classList.add('hidden');
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeShowModal() {
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      document.getElementById('cropperContainer').classList.add('hidden');
      document.getElementById('showModal').classList.remove('flex');
      document.getElementById('showModal').classList.add('hidden');
    }

    async function saveShow() {
      const editId = document.getElementById('editShowId').value;
      const name = document.getElementById('inputShowName').value.trim();
      const radioName = document.getElementById('inputRadioName').value.trim();
      const hashtag = document.getElementById('inputShowHashtag').value.trim();
      const personality = document.getElementById('inputShowPersonality').value.trim();
      const station = document.getElementById('inputShowStation').value.trim();
      const icon = document.getElementById('inputShowIconBase64').value.trim();

      if (!name) {
        alert('番組名を入力してください');
        return;
      }

      if (editId) {
        const show = showsData.find(s => s.id === editId);
        if (show) {
          show.name = name;
          show.radioName = radioName;
          show.hashtag = hashtag;
          show.personality = personality;
          show.station = station;
          show.icon = icon;
        }
      } else {
        showsData.push({
          id: 'show_' + Date.now(),
          name,
          radioName,
          hashtag,
          personality,
          station,
          icon,
          episodes: []
        });
      }

      await saveDataToDB();
      closeShowModal();
      renderShowList();
    }

    async function deleteShowFromModal() {
      const editId = document.getElementById('editShowId').value;
      if (!editId || !confirm('この番組とすべての放送回データを削除しますか？')) return;
      showsData = showsData.filter(s => s.id !== editId);
      await saveDataToDB();
      closeShowModal();
      renderShowList();
    }

    function openEpisodeModal(episodeId = null) {
      const modal = document.getElementById('episodeModal');
      const title = document.getElementById('episodeModalTitle');
      const editId = document.getElementById('editEpisodeId');
      const dateInput = document.getElementById('inputEpisodeDate');
      const memoInput = document.getElementById('inputEpisodeMemo');
      const deleteBtn = document.getElementById('deleteEpisodeBtnInModal');

      if (episodeId) {
        const show = showsData.find(s => s.id === currentShowId);
        const episode = show.episodes.find(e => e.id === episodeId);
        title.textContent = '放送回を編集';
        editId.value = episode.id;
        dateInput.value = episode.date || '';
        memoInput.value = episode.memo || '';
        deleteBtn.classList.remove('hidden');
      } else {
        title.textContent = '放送回を追加';
        editId.value = '';
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
        memoInput.value = '';
        deleteBtn.classList.add('hidden');
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEpisodeModal() {
      document.getElementById('episodeModal').classList.remove('flex');
      document.getElementById('episodeModal').classList.add('hidden');
    }

    async function saveEpisode() {
      const editId = document.getElementById('editEpisodeId').value;
      const date = document.getElementById('inputEpisodeDate').value.trim();
      const memo = document.getElementById('inputEpisodeMemo').value.trim();

      if (!date) {
        alert('放送日を入力してください');
        return;
      }

      const show = showsData.find(s => s.id === currentShowId);
      if (!show) return;

      if (editId) {
        const episode = show.episodes.find(e => e.id === editId);
        if (episode) {
          episode.date = date;
          episode.memo = memo;
        }
      } else {
        show.episodes.push({
          id: 'ep_' + Date.now(),
          date,
          memo,
          messages: []
        });
      }

      show.episodes.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      await saveDataToDB();
      closeEpisodeModal();
      updateFiscalYearFilterOptions();
      renderEpisodeList();
    }

    async function deleteEpisodeFromModal() {
      const editId = document.getElementById('editEpisodeId').value;
      if (!editId || !confirm('この放送回とすべてのメール内容を削除しますか？')) return;
      const show = showsData.find(s => s.id === currentShowId);
      if (show) {
        show.episodes = show.episodes.filter(e => e.id !== editId);
        await saveDataToDB();
      }
      closeEpisodeModal();
      updateFiscalYearFilterOptions();
      renderEpisodeList();
    }

    function openShowContextMenu(e, showId) {
      e.stopPropagation();
      closeAllContextMenus();
      selectedShowIdForContext = showId;
      const menu = document.getElementById('showContextMenu');
      menu.style.left = `${Math.min(e.clientX, window.innerWidth - 140)}px`;
      menu.style.top = `${e.clientY + 10}px`;
      menu.classList.remove('hidden');
    }

    function openEpisodeContextMenu(e, episodeId) {
      e.stopPropagation();
      closeAllContextMenus();
      selectedEpisodeIdForContext = episodeId;
      const menu = document.getElementById('episodeContextMenu');
      menu.style.left = `${Math.min(e.clientX, window.innerWidth - 140)}px`;
      menu.style.top = `${e.clientY + 10}px`;
      menu.classList.remove('hidden');
    }

    async function showContextAction(type) {
      closeAllContextMenus();
      if (type === 'edit') openShowModal(selectedShowIdForContext);
      if (type === 'delete') {
        if (confirm('この番組とすべての放送回データを削除しますか？')) {
          showsData = showsData.filter(s => s.id !== selectedShowIdForContext);
          await saveDataToDB();
          renderShowList();
        }
      }
    }

    async function episodeContextAction(type) {
      closeAllContextMenus();
      if (type === 'edit') openEpisodeModal(selectedEpisodeIdForContext);
      if (type === 'delete') {
        if (confirm('この放送回とすべてのメール内容を削除しますか？')) {
          const show = showsData.find(s => s.id === currentShowId);
          if (show) {
            show.episodes = show.episodes.filter(e => e.id !== selectedEpisodeIdForContext);
            await saveDataToDB();
            updateFiscalYearFilterOptions();
            renderEpisodeList();
          }
        }
      }
    }

    function openMsgActionMenu(e, msgId) {
      e.stopPropagation();
      closeAllContextMenus();
      selectedMsgIdForContext = msgId;
      const menu = document.getElementById('msgActionMenu');
      menu.style.left = `${Math.min(e.clientX - 60, window.innerWidth - 170)}px`;
      menu.style.top = `${Math.min(e.clientY + 10, window.innerHeight - 180)}px`;
      menu.classList.remove('hidden');
    }

    async function msgAction(actionType) {
      closeAllContextMenus();
      if (!selectedMsgIdForContext) return;

      const show = showsData.find(s => s.id === currentShowId);
      const episode = show.episodes.find(e => e.id === currentEpisodeId);

      if (actionType === 'edit') {
        const msg = episode.messages.find(m => m.id === selectedMsgIdForContext);
        if (!msg) return;
        document.getElementById('editMsgId').value = msg.id;
        document.getElementById('editCornerText').value = msg.corner || '';
        document.getElementById('editMsgText').value = msg.text || '';
        document.getElementById('editReactionText').value = msg.reaction || '';
        const modal = document.getElementById('msgEditModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else if (actionType === 'up') {
        await moveMessageOrder(selectedMsgIdForContext, 'up');
      } else if (actionType === 'down') {
        await moveMessageOrder(selectedMsgIdForContext, 'down');
      } else if (actionType === 'delete') {
        if (confirm('この採用メールを削除しますか？')) {
          episode.messages = episode.messages.filter(m => m.id !== selectedMsgIdForContext);
          await saveDataToDB();
          renderChatMessages();
        }
      }
    }

    function closeMsgEditModal() {
      document.getElementById('msgEditModal').classList.remove('flex');
      document.getElementById('msgEditModal').classList.add('hidden');
    }

    async function saveEditedMessage() {
      const msgId = document.getElementById('editMsgId').value;
      const corner = document.getElementById('editCornerText').value.trim();
      const text = document.getElementById('editMsgText').value.trim();
      const reaction = document.getElementById('editReactionText').value.trim();
      if (!text) return;

      const show = showsData.find(s => s.id === currentShowId);
      const episode = show.episodes.find(e => e.id === currentEpisodeId);
      const msg = episode.messages.find(m => m.id === msgId);
      if (msg) {
        msg.corner = corner;
        msg.text = text;
        msg.reaction = reaction;
        await saveDataToDB();
        closeMsgEditModal();
        renderChatMessages();
      }
    }

    async function moveMessageOrder(msgId, direction) {
      const show = showsData.find(s => s.id === currentShowId);
      const episode = show.episodes.find(e => e.id === currentEpisodeId);
      const idx = episode.messages.findIndex(m => m.id === msgId);
      if (idx === -1) return;

      if (direction === 'up' && idx > 0) {
        const temp = episode.messages[idx];
        episode.messages[idx] = episode.messages[idx - 1];
        episode.messages[idx - 1] = temp;
      } else if (direction === 'down' && idx < episode.messages.length - 1) {
        const temp = episode.messages[idx];
        episode.messages[idx] = episode.messages[idx + 1];
        episode.messages[idx + 1] = temp;
      }
      await saveDataToDB();
      renderChatMessages();
    }

    async function sendMessage() {
      const cornerInput = document.getElementById('cornerInput');
      const messageInput = document.getElementById('messageInput');
      const reactionInput = document.getElementById('reactionInput');

      const corner = cornerInput.value.trim();
      const text = messageInput.value.trim();
      const reaction = reactionInput.value.trim();

      if (!text || !currentShowId || !currentEpisodeId) return;

      const show = showsData.find(s => s.id === currentShowId);
      const episode = show.episodes.find(e => e.id === currentEpisodeId);

      episode.messages.push({
        id: 'msg_' + Date.now(),
        corner,
        text,
        reaction
      });

      show.episodes.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      await saveDataToDB();
      messageInput.value = '';
      reactionInput.value = '';
      cornerInput.value = '';
      renderChatMessages();
    }

    function exportBackup() {
      const backup = { version: 1, exportedAt: new Date().toISOString(), shows: showsData };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `maillog_backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('バックアップファイルを書き出しました');
      setTimeout(hideToast, 2000);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const backup = JSON.parse(reader.result);
          const importedShows = Array.isArray(backup) ? backup : backup.shows;
          if (!Array.isArray(importedShows)) throw new Error();
          if (!confirm('現在のすべてのデータを置き換えます。よろしいですか？')) return;
          showsData = importedShows;
          currentShowId = null;
          currentEpisodeId = null;
          await saveDataToDB();
          switchScreen('screen-shows');
          showToast('バックアップを読み込みました');
          setTimeout(hideToast, 2000);
        } catch {
          alert('ファイルを読み込めませんでした。');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('searchShow').addEventListener('input', (e) => renderShowList(e.target.value.trim()));
    document.getElementById('searchEpisode').addEventListener('input', (e) => renderEpisodeList(e.target.value.trim()));

    const buttons = document.querySelectorAll('.track-btn');
    buttons.forEach(button => {
      button.addEventListener('click', function() {
        const buttonName = this.getAttribute('data-button-name');
        gtag('event', 'button_click', {
          'button_name': buttonName,
          'page_location': window.location.href
        });
      });
    });

    initDB()
      .then(async () => {
        await loadDataFromDB();
        renderShowList();
      })
      .catch(err => {
        console.error('IndexedDB initialization failed:', err);
        showToast('データベースの初期化に失敗しました');
      });
  </script>
</body>
</html>
